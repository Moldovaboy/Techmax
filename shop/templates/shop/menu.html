{% load static %}
<nav class="navbar shadow sticky-top p-3 mb-4" style="background-color: #588157;">
  <div class="container-fluid">
    <a class="navbar-brand link-light" href="{% url 'shop' %}"><img src="{% static 'bilder/logo.png' %}"></a>
      <div class="navbar-nav">
          <div class="d-flex align-items-center"> 
        {% if request.user.is_authenticated %}
        <a class="btn btn-white text-dark p-2" href="{% url 'logout' %}">Logout</a>
        {% else %}    
        <a class="btn btn-white text-dark p-2" href="{% url 'login' %}">Login</a>
        {% endif %}
        <a class="nav-link link-light p-2" href="{% url 'warenkorb' %}"><img src="{% static 'bilder/floppy.png' %}">
        {% if menge >= 1 %}
          <span class="badge rounded-pill bg-danger position-absolute top-25 start-25 translate-middle">{{menge}}</span>
        {% endif %}
        </a>
          </div>    
      </div>
  </div>
</nav>
